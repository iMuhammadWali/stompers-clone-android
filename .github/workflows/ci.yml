name: Mobile checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:ui
      - run: npx expo export --platform android
      - run: npm run export:web
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
